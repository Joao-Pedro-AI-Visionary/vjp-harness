version: "1.11.0"
author: "João Pedro (V-JP) <dev.jp.991@gmail.com> · github.com/Joao-Pedro-AI-Visionary"
project:
  name: "__PROJECT_NAME__"
  description: "Ecossistema de engenharia orientado a IA"

# Fonte da verdade determinística dos componentes (versões pinadas + origem):
#   registry.json   (machine-readable, consumido por tools/verify.js)
#   REGISTRY.md      (espelho legível)
# Verifique tudo com: node .harness/tools/bsd.js --doctor
registry: ".harness/registry.json"

paths:
  harness_root: ".harness"
  tools_dir: ".harness/tools"
  config_dir: ".harness/config"
  context_dir: ".harness/context"
  gbrain_dir: ".gbrain"
  bsd_dir: ".bsd"

tools:
  repomix:
    version: "1.16.0"
    path: ".harness/tools/node_modules/repomix/bin/repomix.cjs"
    config: ".harness/config/repomix.config.json"
  gsd:
    version: "1.1.0"
    path: ".harness/tools/node_modules/@opengsd/get-shit-done-redux/bin/gsd-sdk.js"
  rtk:
    version: "0.42.4"
    source: "git:rtk-ai/rtk"
  gbrain:
    version: "0.35.1.0"
    source: "git:garrytan/gbrain@eval-run-v0.35.1.0-baseline"
  superpowers:
    version: "5.1.0"
    source: "git:obra/superpowers@v5.1.0"
  frontend_designer:
    version: "main"
    source: "git:anthropics/skills@frontend-design"

agents:
  planner:
    enabled: true
    role: "Análise de Risco e Planejamento"
  nfr_planner:
    enabled: true
    role: "Requisitos não-funcionais: fila/assíncrono/paralelismo/performance (antes do código)"
  contract:
    enabled: true
    role: "Contrato de API — fonte da verdade compartilhada Back↔Front"
  researcher:
    enabled: true
    role: "Mapeamento de Impacto e Exploração"
  executor:
    enabled: true
    role: "Escrita de Código e Testes TDD (especialista por camada: backend/db/frontend)"
  reviewer:
    enabled: true
    role: "Validação estrita: contrato, persistência, E2E, performance, NFR"

# Subagentes especialistas (camada interativa Claude Code) — instalados em .claude/agents/
specialists:
  backend-specialist: { enabled: true, role: "NestJS/Prisma conforme contrato + persistência real" }
  db-migration-specialist: { enabled: true, role: "Migrations + índices (EXPLAIN/HypoPG)" }
  frontend-specialist: { enabled: true, role: "Consome contrato + E2E Playwright" }
  nfr-performance-planner: { enabled: true, role: "Fila/assíncrono/idempotência/perf" }
  integration-verifier: { enabled: true, role: "Fluxo real front→API→DB + persistência" }

mcp:
  # v1.7.0: server-postgres (vulnerável) substituído por Postgres MCP Pro (crystaldba).
  postgres:
    enabled: true
    version: "0.3.0"
    package: "crystaldba/postgres-mcp"
    run: "uvx postgres-mcp==0.3.0 --access-mode=restricted   # ou docker crystaldba/postgres-mcp:0.3.0"
    port: 5432
    trigger_extensions:
      - ".repository.ts"
      - ".entity.ts"
      - "prisma"
  codebase_memory:
    enabled: true
    version: "0.8.1"
    package: "codebase-memory-mcp"
    path: ".harness/tools/node_modules/codebase-memory-mcp/bin.js"
    trigger_extensions:
      - ".ts"
      - ".tsx"
      - ".cs"
  playwright:
    enabled: true
    version: "0.0.75"
    package: "@playwright/mcp"
    trigger_directories:
      - "web"
      - "frontend"
      - "mobile"

pipeline:
  max_retries: 2
  allow_worktrees: true
