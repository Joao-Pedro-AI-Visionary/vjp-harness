version: "1.7.0"
author: "João Pedro (V-JP) <dev.jp.991@gmail.com> · github.com/Joao-Pedro-AI-Visionary"
project:
  name: "__PROJECT_NAME__"
  description: "Ecossistema de engenharia orientado a IA"

# Fonte da verdade determinística dos componentes (versões pinadas + origem):
#   registry.json   (machine-readable, consumido por tools/verify.js)
#   REGISTRY.md      (espelho legível)
# Verifique tudo com: node .harness/tools/bsd.js --doctor
registry: ".harness/registry.json"

paths:
  harness_root: ".harness"
  tools_dir: ".harness/tools"
  config_dir: ".harness/config"
  context_dir: ".harness/context"
  gbrain_dir: ".gbrain"
  bsd_dir: ".bsd"

tools:
  repomix:
    version: "0.2.14"
    path: ".harness/tools/node_modules/repomix/bin/repomix.cjs"
    config: ".harness/config/repomix.config.json"
  gsd:
    version: "1.1.0"
    path: ".harness/tools/node_modules/@opengsd/get-shit-done-redux/bin/gsd-sdk.js"
  rtk:
    version: "0.42.3"
    source: "git:rtk-ai/rtk"
  gbrain:
    version: "0.35.1.0"
    source: "git:garrytan/gbrain@eval-run-v0.35.1.0-baseline"
  superpowers:
    version: "5.1.0"
    source: "git:obra/superpowers@v5.1.0"
  frontend_designer:
    version: "main"
    source: "git:anthropics/skills@frontend-design"

agents:
  planner:
    enabled: true
    role: "Análise de Risco e Planejamento"
  researcher:
    enabled: true
    role: "Mapeamento de Impacto e Exploração"
  executor:
    enabled: true
    role: "Escrita de Código e Testes TDD"
  reviewer:
    enabled: true
    role: "Validação estrita de Qualidade e Segurança"

mcp:
  # v1.7.0: server-postgres (vulnerável) substituído por Postgres MCP Pro (crystaldba).
  postgres:
    enabled: true
    version: "0.3.0"
    package: "crystaldba/postgres-mcp"
    run: "uvx postgres-mcp==0.3.0 --access-mode=restricted   # ou docker crystaldba/postgres-mcp:0.3.0"
    port: 5432
    trigger_extensions:
      - ".repository.ts"
      - ".entity.ts"
      - "prisma"
  codebase_memory:
    enabled: true
    version: "0.8.1"
    package: "codebase-memory-mcp"
    path: ".harness/tools/node_modules/codebase-memory-mcp/bin.js"
    trigger_extensions:
      - ".ts"
      - ".tsx"
      - ".cs"
  playwright:
    enabled: true
    version: "0.0.75"
    package: "@playwright/mcp"
    trigger_directories:
      - "web"
      - "frontend"
      - "mobile"

pipeline:
  max_retries: 2
  allow_worktrees: true
