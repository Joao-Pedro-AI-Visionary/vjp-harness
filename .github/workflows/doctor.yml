name: doctor

# CI determinística do V-JP Harness (por João Pedro / V-JP).
# Roda em cada push/PR: instala as ferramentas pinadas, roda os auto-testes (node:test)
# e o verificador de determinismo (verify.js, modo NÃO-strict).
#
# Por que NÃO --strict: o doctor --strict exige TODOS os opcionais presentes
# (headroom global, uvx/Postgres MCP Pro, gbrain/superpowers vendorizados, skills em ~/.claude),
# que não existem num runner limpo. O gate de CT é: obrigatórios OK + auto-testes verdes.

# MANUAL por padrão (workflow_dispatch): em repo PRIVADO sem minutos de Actions,
# todo push dava startup_failure. A checagem de cada commit é LOCAL e grátis:
#   (cd .harness/tools && npm run check)   # = node:test + verify.js
# Se o repo virar público (Actions grátis/ilimitado) ou o billing for ajustado,
# descomente os gatilhos push/pull_request abaixo.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar ferramentas pinadas (npm ci)
        working-directory: template/tools
        run: npm ci --no-audit --no-fund

      - name: Auto-testes (node:test)
        working-directory: template/tools
        run: npm test

      - name: Verificador de determinismo (obrigatórios)
        working-directory: template/tools
        run: node verify.js --json
